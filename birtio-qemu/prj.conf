CONFIG_BUILD_OUTPUT_BIN=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y

# Console and shell
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# CONFIG_SHELL=y
# CONFIG_NET_SHELL=y
# CONFIG_THREAD_MONITOR=y

# VirtIO
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_ETH_VIRTIO_NET=y
CONFIG_SLIP=n
CONFIG_ETH_LOWRISC=n

# IP
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.42.16"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.42.1"

# Entropy
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Buffers
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_HEAP_MEM_POOL_SIZE=32768

# ── Timer resolution ───────────────────────────────────────────
# Increase tick rate for better RTT resolution.
# 1000 Hz = 1000 us/tick.  Try 1000000 (1 us) if your board supports it.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_NET_SOCKETS_POLL_MAX=8

# Default settings for M-Mode
# CONFIG_RISCV_MACHINE_TIMER=y
# CONFIG_RISCV_SUPERVISOR_TIMER=n

# Supervisor mode (comment the configs below to enable S-Mode)
CONFIG_RISCV_SBI_BOOT=y
CONFIG_RISCV_S_MODE=y
CONFIG_RISCV_SUPERVISOR_TIMER=y
CONFIG_RISCV_MACHINE_TIMER=n

# enable the virtio shared memory allocator
CONFIG_VIRTIO_SHM_ALLOC=y
CONFIG_RISCV_PMP=n

# Subir prioridad de los threads de red
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_TC_RX_COUNT=1
CONFIG_NET_TC_TX_COUNT=1